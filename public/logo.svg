<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-labelledby="logo-title">
  <title id="logo-title">KEYHOLE</title>
  <defs>
    <style>
      .kh-ring { fill: none; stroke: #48b8dd; stroke-width: 3; }
      .kh-ring-inner { fill: none; stroke: #48b8dd; stroke-width: 1.5; opacity: 0.55; }
      .kh-tick { stroke: #48b8dd; stroke-width: 2.5; stroke-linecap: round; opacity: 0.85; }
      .kh-field { fill: #0a1620; opacity: 0.92; }
      .kh-slot { fill: #eaf6ff; }
    </style>
  </defs>

  <!-- Aperture housing. Static: the gaze effect leaves #globe_cage in place. -->
  <g id="globe_cage">
    <circle class="kh-ring" cx="50" cy="50" r="44" />
    <circle class="kh-ring-inner" cx="50" cy="50" r="37" />
    <g class="kh-tick">
      <line x1="50" y1="2" x2="50" y2="11" />
      <line x1="50" y1="89" x2="50" y2="98" />
      <line x1="2" y1="50" x2="11" y2="50" />
      <line x1="89" y1="50" x2="98" y2="50" />
    </g>
  </g>

  <!-- The keyhole itself. #globe is translated toward the pointer by
       logoGaze.js, so the aperture appears to track the cursor. -->
  <g id="globe">
    <circle class="kh-field" cx="50" cy="50" r="34" />
    <path class="kh-slot"
          d="M50 30
             a11 11 0 0 1 6.4 19.95
             L61.5 70.5
             a1.6 1.6 0 0 1 -1.58 1.9
             h-19.84
             a1.6 1.6 0 0 1 -1.58 -1.9
             l5.1 -20.55
             A11 11 0 0 1 50 30 Z" />
  </g>
</svg>
